<!DOCTYPE html>
<html>
<head>
    <title>SyncPlay</title>
</head>
<body>
<div data-role="page" class="page type-interior pluginConfigurationPage syncPlayConfigurationPage" data-require="emby-input,emby-button,emby-checkbox">
    <div data-role="content">
        <div class="content-primary">
            <form class="syncPlayConfigurationForm">
                <div class="verticalSection verticalSection-extrabottompadding">
                    <h2 class="sectionTitle">SyncPlay 低延迟同步</h2>
                    <p class="fieldDescription">这些默认值针对 Emby Web 与低延迟网络优化。修改后保存即可生效。</p>
                </div>
                <div class="inputContainer"><label class="inputLabel inputLabelUnfocused" for="HeartbeatIntervalMs">心跳周期（毫秒）</label><input id="HeartbeatIntervalMs" is="emby-input" type="number" min="100" max="2000" step="50"></div>
                <div class="inputContainer"><label class="inputLabel inputLabelUnfocused" for="SoftDriftThresholdMs">柔性纠偏阈值（毫秒）</label><input id="SoftDriftThresholdMs" is="emby-input" type="number" min="40" max="1000" step="10"></div>
                <div class="inputContainer"><label class="inputLabel inputLabelUnfocused" for="HardDriftThresholdMs">硬跳转阈值（毫秒）</label><input id="HardDriftThresholdMs" is="emby-input" type="number" min="100" max="5000" step="50"></div>
                <div class="inputContainer"><label class="inputLabel inputLabelUnfocused" for="ReadyBufferSeconds">恢复播放所需缓冲（秒）</label><input id="ReadyBufferSeconds" is="emby-input" type="number" min="1" max="15"></div>
                <div class="inputContainer"><label class="inputLabel inputLabelUnfocused" for="MaxMembersPerRoom">每房最大成员数</label><input id="MaxMembersPerRoom" is="emby-input" type="number" min="2" max="100"></div>
                <label class="checkboxContainer"><input id="EnableDebugLogging" is="emby-checkbox" type="checkbox"><span>启用详细调试日志</span></label>
                <button is="emby-button" type="submit" class="raised button-submit block"><span>保存</span></button>
            </form>
        </div>
    </div>
    <script type="text/javascript" src="/web/configurationpage?name=syncplayconfigjs"></script>
</div>
</body>
</html>
